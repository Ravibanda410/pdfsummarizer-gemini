[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfsummarizer-gemini"
version = "0.1.0"
description = "Summarize PDF documents with Google Gemini via LangChain and Streamlit"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.40",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "tiktoken>=0.7",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
